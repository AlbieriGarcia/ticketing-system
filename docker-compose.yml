services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-tickets}
      POSTGRES_USER: ${DB_USERNAME:-tickets}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-tickets} -d ${DB_DATABASE:-tickets}"]
      interval: 5s
      timeout: 3s
      retries: 10

  php-api:
    build: ./php-service
    env_file: ./php-service/.env
    environment:
      DB_HOST: postgres
    ports:
      - "8000:8000"
    volumes:
      - ./php-service:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
