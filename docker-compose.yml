services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tickets
      POSTGRES_USER: tickets
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets -d tickets"]
      interval: 5s
      timeout: 3s
      retries: 10

  php-api:
    build: ./php-service
    image: ticketing-php
    environment:
      RUN_SETUP: "true"
      SERVICE_NAME: php-api
      SEQ_URL: http://seq
    ports:
      - "8000:8000"
    volumes:
      - ./php-service:/var/www/html
      - /var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 90s

  php-scheduler:
    image: ticketing-php
    pull_policy: never
    command: ["php", "artisan", "schedule:work"]
    environment:
      SERVICE_NAME: php-scheduler
      SEQ_URL: http://seq
    volumes:
      - ./php-service:/var/www/html
      - /var/www/html/vendor
    depends_on:
      php-api:
        condition: service_healthy

  php-outbox:
    image: ticketing-php
    pull_policy: never
    command: ["php", "artisan", "outbox:relay"]
    environment:
      SERVICE_NAME: php-outbox
      SEQ_URL: http://seq
    volumes:
      - ./php-service:/var/www/html
      - /var/www/html/vendor
    depends_on:
      php-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: tickets
      RABBITMQ_DEFAULT_PASS: secret
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  stats-api:
    build: ./dotnet-service
    environment:
      PhpApi__BaseUrl: http://php-api:8000/api
      ConnectionStrings__Stats: Host=postgres;Port=5432;Database=tickets;Username=stats_reader;Password=stats_secret
      Security__ApiKey: ${STATS_API_KEY:-dev-stats-key}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: tickets
      RabbitMq__Password: secret
      OTEL_SERVICE_NAME: stats-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://seq/ingest/otlp
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    ports:
      - "5000:5000"
    depends_on:
      php-api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Logs y trazas centralizados de todos los servicios (UI en :5341)
  # Con usuario admin: la licencia gratuita admite un solo usuario y sin login cada pestaña cuenta como uno distinto.
  # La contraseña solo se aplica al crear el volumen; la ingesta de logs no requiere login
  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      # Contraseña inicial temporal: Seq obliga a cambiarla en el primer login y seq-setup la cambia por SEQ_ADMIN_PASSWORD
      SEQ_FIRSTRUN_ADMINPASSWORD: bootstrap-${SEQ_ADMIN_PASSWORD:-seqadmin1234}
    ports:
      - "5341:80"
    volumes:
      - seqdata:/data

  # Tarea de un solo uso: crea las alertas de Seq si faltan y termina
  seq-setup:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/setup.sh"]
    environment:
      SEQ_ADMIN_PASSWORD: ${SEQ_ADMIN_PASSWORD:-seqadmin1234}
    volumes:
      - ./docker/seq/setup.sh:/setup.sh:ro
    depends_on:
      - seq
    restart: "no"

volumes:
  pgdata:
  seqdata:
